id: "mlcupscale"
name: "MLCUpscale"
version: "beta"
status: "beta"
category: "AI Tools"
license: "MIT"
platforms: [Linux, macOS]
github: ""
openapi: "openapi.yaml"
screenshots:
  - ""
slogan_en: "High-performance REST API for AI-based image upscaling of massive files."
slogan_de: "Hochleistungs-REST-API für KI-basiertes Image-Upscaling von riesigen Dateien."

features:
  - icon: "maximize"
    title_en: "AI Upscaling"
    title_de: "KI-Upscaling"
    desc_en: "High-quality 2x, 3x, and 4x image upscaling using Real-ESRGAN models."
    desc_de: "Hochwertiges 2x, 3x und 4x Image-Upscaling mit Real-ESRGAN-Modellen."
  - icon: "image"
    title_en: "Massive Image Support"
    title_de: "Unterstützung für riesige Bilder"
    desc_en: "Specifically designed to handle huge images up to 10,000x10,000 pixels and beyond."
    desc_de: "Speziell für die Verarbeitung riesiger Bilder bis zu 10.000x10.000 Pixeln und mehr entwickelt."
  - icon: "zap"
    title_en: "GPU Acceleration"
    title_de: "GPU-Beschleunigung"
    desc_en: "Optimized for Vulkan-compatible GPUs (NVIDIA, AMD, Intel) with automatic CPU fallback."
    desc_de: "Optimiert für Vulkan-kompatible GPUs (NVIDIA, AMD, Intel) mit automatischem CPU-Fallback."
  - icon: "activity"
    title_en: "Async REST API"
    title_de: "Asynchrone REST-API"
    desc_en: "Modern asynchronous API for job submission, real-time status tracking, and download."
    desc_de: "Moderne asynchrone API für die Job-Einreichung, Echtzeit-Statusverfolgung und Download."
  - icon: "layers"
    title_en: "Specialized Models"
    title_de: "Spezialisierte Modelle"
    desc_en: "Includes optimized models for general photos, anime art, and video frames."
    desc_de: "Enthält optimierte Modelle für allgemeine Fotos, Anime-Kunst und Videoframes."
  - icon: "container"
    title_en: "Docker Ready"
    title_de: "Docker-Unterstützung"
    desc_en: "Fully containerized for easy deployment with health checks, metrics, and rate limiting."
    desc_de: "Vollständig containerisiert für einfache Bereitstellung mit Health Checks, Metriken und Rate Limiting."
